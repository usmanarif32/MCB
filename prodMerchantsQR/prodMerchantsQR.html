<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" /> 
    <title>QR Code Generator</title>
	<!-- add icon link -->
    <link rel="icon" href="../images/mcb.png" type="image/x-icon">
	<meta http-equiv="Content-Type" charset="utf-8" content="application/javascript">
	<link rel="stylesheet" href="prodMerchantsQR.css">
	
</head>
<body>


	<script src="../scripts/script.js"></script>
	<script src="../scripts/easy.qrcode.min.js"></script>
    <script src="../scripts/jquery.min.js"></script>
	<script src="../scripts/jspdf.umd.min.js"></script>
	<div class="container" align="center">
		<input type="search" name="query" id="businessName" placeholder="Search by merchant business name...">
		<button type="submit" onclick="search()">Search</button>
		<button type="submit" onclick="clearSearch()">Clear</button>
	</div>
	<div class="container" align="center">
		<input type="search" name="query" id="acctNoIBAN" placeholder="Search by account number or IBAN...">
		<button type="submit" onclick="searchByAcctNoIBAN()">Search</button>
		<button type="submit" onclick="clearSearch()">Clear</button>
	</div>
	<div class="container" align="center">
		<!--<label for="merchantCity">Select City</label>-->
		<select id="merchantCity">
			<option value="Search by city">Search by city</option>
			<option value="Karachi">Karachi</option>
			<option value="Lahore">Lahore</option>
			<option value="ISLAMABAD">Islamabad</option>
			<option value="Rawalpindi">Rawalpindi</option>
			<option value="Faisalabad">Faisalabad</option>
			<option value="Multan">Multan</option>
			<option value="Peshawar">Peshawar</option>
			<option value="Quetta">Quetta</option>
			<option value="Sialkot">Sialkot</option>
			<option value="Gujranwala">Gujranwala</option>
			<option value="Hyderabad">Hyderabad</option>
			<option value="Sukkur">Sukkur</option>
			<option value="Bahawalpur">Bahawalpur</option>
		</select>
		<button type="submit" onclick="searchByCity()">Search</button>
		<button type="submit" onclick="clearSearch()">Clear</button>
	</div>
    <div id="root"></div>
	<br>
    <button id="cmd">Download</button>
	
	
	<script src="prodMerchantsQR.js"></script>
   
</body>
</html>
